{% extends "base.html" %}
{% block titulo %}Relatórios{% endblock %}
{% block conteudo %}
<h4 class="mb-3"><i class="bi bi-graph-up"></i> Relatórios</h4>
<div class="row g-3">
  {% for chave, (titulo, desc, periodo) in relatorios.items() %}
  <div class="col-md-6 col-lg-4"><a href="{{ url_for('relatorios.ver', chave=chave) }}" class="text-decoration-none">
    <div class="card card-modulo h-100"><div class="card-body"><h6 class="text-dark mb-1">{{ titulo }}</h6><small class="text-muted">{{ desc }}</small></div></div></a></div>
  {% endfor %}
</div>
<p class="small text-muted mt-3">Todos os relatórios exportam para Excel (.xlsx), CSV e PDF.</p>
{% endblock %}
