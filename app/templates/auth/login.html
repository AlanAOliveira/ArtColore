{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="login-box">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h4 class="text-center mb-4"><i class="bi bi-pencil-square text-primary"></i> {{ empresa_nome }}</h4>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Usuário</label>
        <input name="login" class="form-control" value="{{ login or '' }}" autofocus required autocomplete="username"></div>
      <div class="mb-3"><label class="form-label">Senha</label>
        <input name="senha" type="password" class="form-control" required autocomplete="current-password"></div>
      <button class="btn btn-primary w-100">Entrar</button>
    </form>
    <p class="text-muted small text-center mt-3 mb-0">Modo de teste — usuários em <code>usuarios_padrao.json</code></p>
  </div></div>
</div>
{% endblock %}
